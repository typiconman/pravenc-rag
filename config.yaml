# Corpus location: clone github.com/slavonic/pravenc-md into ./data/pravenc-md
corpus_dir: ./data/pravenc-md/articles

# Qdrant (see docker-compose.yml)
qdrant_url: http://localhost:6333
collection: pravenc

# Embedding
embed_model: BAAI/bge-m3
dense_dim: 1024
batch_size: 16

chunking:
  max_tokens: 512
  overlap_tokens: 64

# Deterministic Russian-heading -> section-type map (a lookup, never MT).
# Populate from `pravenc-audit run`. Unmapped headings become "other".
section_types:
  Гимнография: hymnography
  Иконография: iconography
  Источники: sources
  Литература: literature
  Сочинения: works
  Почитание: veneration
  История: history
  Жизнь: life
  Религия: religion
  Биография: biography
  Архитектура: architecture
  Ислам: Islam
  Архиереи: bishops
  Житие: Vita
  Монастыри: monasteries
  Римско-католическая Церковь: Roman Catholic Church
  Святыни: shrines
  Религиозное законодательство: religious legislation
  Протестантские церкви, деноминации и секты: Protestants
  Иудаизм: Judaism
  Богословие: theology
  Население: population
  Государственное устройство: state structures
  Учение: teaching
  Православие: Orthodoxy
  Новые религиозные движения: new religious movements
  Содержание: contents
  Старообрядчество: Old Believers
  Исторический очерк: historical overview
  Буддизм: Buddhism
  Библиотека: library
  Христология: christology
  Мощи: relics
  География: geography
  Архитектурный ансамбль: architectural ensemble
  Мученичество: martyrdom
  Эсхатология: eschatology
  В Новом Завете: New Testament
  Материальное положение: material status
  Некрополь: cemetery

# ---- query stage ----
retrieval:
  hybrid_limit: 40          # candidates from Qdrant (cheap)
  rerank_candidates: 20     # cross-encoder passes — the CPU bottleneck
  top_n: 5                  # sections handed to the LLM
  use_reranker: true
  reranker_model: BAAI/bge-reranker-v2-m3
  exclude_section_types: [sources, literature]

llm:
  provider: openrouter          # openrouter (any OpenAI-compatible host) | ollama
  model: qwen/qwen3.6-27b       # active model; a slug from `pravenc-ask models`
  # Candidates for the UI dropdown and `pravenc-ask compare`.
  # Slugs churn weekly — verify with `pravenc-ask models` or https://openrouter.ai/models
  models:
    - qwen/qwen3.6-27b                   # strong Russian; Apache-2.0
    - qwen/qwen3-next-80b-a3b-instruct   # larger Qwen, good for RAG synthesis
    - google/gemma-4-31b-it              # 140+ languages
    - deepseek/deepseek-v3               # strong reasoning
    - meta-llama/llama-3.3-70b-instruct  # general-purpose baseline
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY        # export this with your key
  ollama_url: http://localhost:11434     # used only when provider: ollama
  num_ctx: 16384
  temperature: 0.2
  request_timeout: 900
  citation_chunk_size: 1024
