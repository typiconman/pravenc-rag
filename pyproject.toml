[project]
name = "pravenc-rag"
version = "0.1.0"
description = "Indexing pipeline for a RAG layer over the pravenc-md corpus"
requires-python = ">=3.11"
dependencies = [
  "python-frontmatter>=1.1",
  "markdown-it-py>=3.0",
  "FlagEmbedding>=1.3",
  "qdrant-client>=1.12",
  "transformers>=4.44",
  "typer>=0.12",
  "pyyaml>=6.0",
  "llama-index-core>=0.12",
  "llama-index-llms-ollama>=0.5",
  "gradio>=5.0",
  "httpx>=0.27",
]

[project.scripts]
pravenc-index = "scripts.index:app"
pravenc-audit = "scripts.audit:app"
pravenc-ask = "scripts.ask:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
